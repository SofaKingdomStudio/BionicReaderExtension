<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bionic Reader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">
        <span class="logo-bold">Bio</span>nic<span class="logo-dim">Reader</span>
      </div>
      <div class="toggle-wrap">
        <label class="toggle" title="Enable / disable bionic reading">
          <input type="checkbox" id="toggle" />
          <span class="track">
            <span class="thumb"></span>
          </span>
        </label>
      </div>
    </header>

    <div class="status-row">
      <span id="status-label" class="status off">Off</span>
    </div>

    <div class="settings" id="settings">

      <div class="setting-row">
        <label class="setting-label" for="ratio">
          Bold ratio
          <span class="setting-hint">how much of each word is bolded</span>
        </label>
        <div class="slider-row">
          <input type="range" id="ratio" min="20" max="65" step="5" value="40" />
          <span class="slider-val" id="ratio-val">40%</span>
        </div>
      </div>

      <div class="setting-row">
        <label class="setting-label">
          Preview
        </label>
        <div class="preview" id="preview">
          The <strong>qui</strong>ck <strong>bro</strong>wn <strong>fo</strong>x <strong>jum</strong>ps <strong>ov</strong>er the <strong>la</strong>zy <strong>do</strong>g.
        </div>
      </div>

    </div>

    <footer>
      <a href="https://github.com/" target="_blank" class="gh-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Open source on GitHub
      </a>
      <span class="version">v1.0.0</span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
