<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bionic Reader</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:      #185FA5;
  --blue-lt:   #E6F1FB;
  --blue-dk:   #0C447C;
  --teal:      #1D9E75;
  --teal-lt:   #E1F5EE;
  --text:      #1a1a1a;
  --text-2:    #5a5a5a;
  --text-3:    #999;
  --bg:        #faf9f7;
  --bg-2:      #f2f0ec;
  --bg-3:      #ffffff;
  --border:    rgba(0,0,0,0.09);
  --border-md: rgba(0,0,0,0.16);
  --radius:    10px;
  --radius-lg: 16px;
  --serif:     'Lora', Georgia, serif;
  --mono:      'DM Mono', 'Courier New', monospace;
  --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

html { font-size: 16px; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Layout ── */

.site-header {
  border-bottom: 0.5px solid var(--border-md);
  background: var(--bg-3);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: -0.3px;
  color: var(--text);
  text-decoration: none;
}
.logo b { font-weight: 600; color: var(--blue); }
.logo span { color: var(--text-2); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: var(--blue-lt);
  color: var(--blue);
  padding: 3px 9px;
  border-radius: 999px;
}

.gh-link {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: var(--radius);
  border: 0.5px solid var(--border-md);
  transition: color 0.15s, border-color 0.15s;
}
.gh-link:hover { color: var(--blue); border-color: var(--blue); }

main {
  flex: 1;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

/* ── Controls bar ── */

.controls-card {
  background: var(--bg-3);
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  align-items: flex-end;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 120px;
}

.ctrl-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-2);
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  width: 120px;
  background: var(--bg-2);
  border-radius: 4px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: transform 0.1s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

.ctrl-val {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  min-width: 32px;
}

select {
  font-size: 13px;
  font-family: var(--sans);
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 0.5px solid var(--border-md);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}
select:focus { border-color: var(--blue); }

/* ── Tabs ── */

.tab-bar {
  display: flex;
  gap: 2px;
  border-bottom: 0.5px solid var(--border-md);
}

.tab-btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  padding: 9px 16px;
  border: none;
  background: none;
  color: var(--text-2);
  cursor: pointer;
  border-radius: 6px 6px 0 0;
  transition: color 0.13s, background 0.13s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); background: var(--bg-2); }
.tab-btn.active { color: var(--blue); font-weight: 500; border-bottom-color: var(--blue); background: none; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Input area ── */

.input-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 16px;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.75;
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-lg);
  background: var(--bg-3);
  color: var(--text);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
textarea:focus { border-color: var(--blue); }
textarea::placeholder { color: var(--text-3); font-style: italic; }

.btn-row { display: flex; gap: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 0.5px solid var(--border-md);
  background: var(--bg-3);
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s, transform 0.1s, border-color 0.12s;
}
.btn:hover { background: var(--bg-2); }
.btn:active { transform: scale(0.98); }

.btn-primary {
  background: var(--blue);
  color: #E6F1FB;
  border-color: var(--blue);
}
.btn-primary:hover { background: var(--blue-dk); border-color: var(--blue-dk); }

/* ── Sample cards ── */

.sample-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.sample-card {
  padding: 12px 14px;
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius);
  cursor: pointer;
  background: var(--bg-3);
  transition: border-color 0.13s, background 0.13s;
}
.sample-card:hover { border-color: var(--blue); }
.sample-card.selected { border-color: var(--blue); background: var(--blue-lt); }

.sample-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.sample-preview {
  font-size: 11px;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.5;
}

/* ── Output ── */

.output-section { display: flex; flex-direction: column; gap: 10px; }

.output-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
}

.output-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-right: auto;
}

.output-box {
  background: var(--bg-3);
  border: 0.5px solid var(--border-md);
  border-radius: var(--radius-lg);
  padding: 2rem 2.25rem;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.85;
  color: var(--text);
}

.output-box p { margin-bottom: 1.1em; }
.output-box p:last-child { margin-bottom: 0; }
.output-box b { font-weight: 700; }

.output-box.font-sans { font-family: var(--sans); }
.output-box.font-mono { font-family: var(--mono); }
.output-box.font-serif { font-family: var(--serif); }

.output-box.size-sm { font-size: 14px; }
.output-box.size-md { font-size: 17px; }
.output-box.size-lg { font-size: 20px; }
.output-box.size-xl { font-size: 24px; }

.output-box.lh-tight  { line-height: 1.55; }
.output-box.lh-normal { line-height: 1.85; }
.output-box.lh-loose  { line-height: 2.2;  }

/* ── Stats ── */

.stats {
  display: flex;
  gap: 24px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}

.stat { display: flex; flex-direction: column; gap: 2px; }

.stat-val {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
}

.stat-lbl {
  font-size: 11px;
  color: var(--text-3);
}

/* ── Footer ── */

footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 12px;
  color: var(--text-3);
  border-top: 0.5px solid var(--border);
}

footer a { color: var(--blue); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* ── Responsive ── */

@media (max-width: 600px) {
  main { padding: 1.25rem 1rem 3rem; }
  .controls-card { padding: 1rem; gap: 1rem; }
  .output-box { padding: 1.25rem; font-size: 15px; }
  .site-header { padding: 0 1rem; }
  .gh-link span { display: none; }
  input[type="range"] { width: 90px; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="logo" href="#"><b>Bio</b>nic<span>Reader</span></a>
  <div class="header-right">
    <span class="badge">open source</span>
    <a class="gh-link" href="https://github.com/" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      <span>GitHub</span>
    </a>
  </div>
</header>

<main>

  <!-- Controls -->
  <div class="controls-card">
    <div class="control-group">
      <span class="ctrl-label">Bold ratio</span>
      <div class="slider-row">
        <input type="range" id="ratio" min="20" max="65" step="5" value="40" />
        <span class="ctrl-val" id="ratio-val">40%</span>
      </div>
    </div>
    <div class="control-group">
      <span class="ctrl-label">Font</span>
      <select id="font-face">
        <option value="font-serif" selected>Lora (Serif)</option>
        <option value="font-sans">Sans-serif</option>
        <option value="font-mono">Monospace</option>
      </select>
    </div>
    <div class="control-group">
      <span class="ctrl-label">Size</span>
      <select id="font-size">
        <option value="size-sm">Small</option>
        <option value="size-md" selected>Medium</option>
        <option value="size-lg">Large</option>
        <option value="size-xl">X-Large</option>
      </select>
    </div>
    <div class="control-group">
      <span class="ctrl-label">Line height</span>
      <select id="line-height">
        <option value="lh-tight">Tight</option>
        <option value="lh-normal" selected>Normal</option>
        <option value="lh-loose">Loose</option>
      </select>
    </div>
  </div>

  <!-- Input -->
  <div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="paste">Paste text</button>
      <button class="tab-btn" data-tab="samples">Samples</button>
    </div>

    <div style="padding-top: 1rem;">
      <div class="tab-panel active" id="panel-paste">
        <div class="input-wrap">
          <textarea id="input-text" placeholder="Paste or type any text here — it converts as you type…" rows="6" spellcheck="false"></textarea>
          <div class="btn-row">
            <button class="btn btn-primary" id="btn-convert">Convert →</button>
            <button class="btn" id="btn-clear">Clear</button>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="panel-samples">
        <div class="sample-grid" id="sample-grid"></div>
        <button class="btn btn-primary" id="btn-load-sample">Load sample →</button>
      </div>
    </div>
  </div>

  <!-- Output -->
  <div class="output-section" id="output-section" style="display:none;">
    <div class="output-toolbar">
      <span class="output-label">Output</span>
      <button class="btn" id="btn-copy-html">Copy HTML</button>
      <button class="btn" id="btn-copy-text">Copy text</button>
      <button class="btn" id="btn-print">Print / Save PDF</button>
    </div>
    <div class="output-box font-serif size-md lh-normal" id="output"></div>
    <div class="stats">
      <div class="stat"><span class="stat-val" id="stat-words">—</span><span class="stat-lbl">words</span></div>
      <div class="stat"><span class="stat-val" id="stat-chars">—</span><span class="stat-lbl">characters</span></div>
      <div class="stat"><span class="stat-val" id="stat-time">—</span><span class="stat-lbl">read time</span></div>
    </div>
  </div>

</main>

<footer>
  <p>BionicReader is <a href="https://github.com/" target="_blank" rel="noopener">open source</a> and free to use. MIT licensed.</p>
</footer>

<script>
// ── Samples ──────────────────────────────────────────────────────────────────

const SAMPLES = [
  {
    title: "The Art of Focus",
    text: `Reading is a complex cognitive process that requires the brain to recognize symbols and decode meaning simultaneously. When we read, our eyes do not glide smoothly across the text. Instead, they jump in short, rapid movements called saccades, pausing briefly at certain points. These pauses, known as fixations, are where the actual reading happens.\n\nBionic Reading leverages this natural behavior by bolding the beginning of each word, giving the brain an anchor point that speeds up the recognition process. With practice, readers report significantly faster comprehension and reduced fatigue during long reading sessions.`
  },
  {
    title: "Philosophy of Mind",
    text: `Consciousness remains one of the most profound mysteries in philosophy and science. What does it mean to be aware? How does subjective experience arise from physical processes in the brain? These questions have occupied thinkers for centuries without resolution.\n\nSome philosophers argue that consciousness is a fundamental feature of reality, while others maintain it emerges entirely from complex information processing. The hard problem of consciousness — explaining why there is something it is like to be us — continues to resist every solution proposed.`
  },
  {
    title: "The Ocean's Depth",
    text: `More than eighty percent of Earth's oceans remain unexplored. Beneath the surface lies a world of crushing pressure, perpetual darkness, and startling biodiversity. Hydrothermal vents on the ocean floor support entire ecosystems that derive energy not from sunlight but from chemical reactions.\n\nStrange creatures illuminate themselves with bioluminescence, and pressure-adapted fish survive conditions that would instantly kill surface-dwelling animals. Every deep-sea expedition returns with species unknown to science, reminding us how little we truly understand about our own planet.`
  },
  {
    title: "On Writing Well",
    text: `Good writing begins with ruthless editing. Every sentence should earn its place. Every word should be the best possible choice. The impulse to write at length — to add qualifications, elaborations, and caveats — must be resisted constantly.\n\nStrong writing is not about saying everything; it is about choosing what to leave out. The most memorable sentences are those where nothing can be removed without loss. Writers who understand this read their drafts as if encountering them for the first time, hunting for every unnecessary syllable.`
  },
  {
    title: "On Solitude",
    text: `Solitude is not the same as loneliness. Loneliness is the pain of unwanted isolation; solitude is the pleasure of chosen aloneness. To be comfortable alone with one's thoughts is one of the rarest and most valuable human capacities — and one of the most difficult to cultivate in an age of constant connection.\n\nWhen we are never alone, we never fully become ourselves. Our opinions, tastes, and feelings are always influenced by those around us. Genuine solitude allows the mind to consolidate experience, integrate emotion, and arrive at conclusions that belong to no one else.`
  },
  {
    title: "The Nature of Time",
    text: `Physics tells us that time is not a river flowing in one direction but a dimension woven into the fabric of spacetime. At speeds approaching light, or near massive gravitational objects, time slows — a phenomenon confirmed by atomic clocks on fast-moving aircraft and satellites.\n\nYet our subjective experience of time has almost nothing to do with physics. Time crawls during boredom and evaporates during joy. A childhood summer feels longer in memory than an adult decade. The mystery is not how time passes but why it feels so different from the inside.`
  }
];

// ── State ─────────────────────────────────────────────────────────────────────

let selectedSample = 0;
let currentText = "";

// ── Bionic engine ─────────────────────────────────────────────────────────────

function boldLen(word, ratio) {
  return Math.max(1, Math.ceil(word.length * ratio));
}

function bionicWord(word, ratio) {
  const bl = boldLen(word, ratio);
  return `<b>${word.slice(0, bl)}</b>${word.slice(bl)}`;
}

function bionicHTML(text, ratio) {
  return text.split('\n').map(para => {
    if (!para.trim()) return '';
    const html = para.replace(/([^\s]+)/g, token => {
      const m = token.match(/^([^a-zA-Z\u00C0-\u024F]*)([a-zA-Z\u00C0-\u024F][a-zA-Z\u00C0-\u024F'\-]*)([^a-zA-Z\u00C0-\u024F]*)$/);
      if (!m) return token;
      const [, pre, word, post] = m;
      return pre + bionicWord(word, ratio) + post;
    });
    return `<p>${html}</p>`;
  }).filter(Boolean).join('');
}

// ── Render ────────────────────────────────────────────────────────────────────

function getRatio() { return parseInt(document.getElementById('ratio').value, 10) / 100; }

function getOutputClasses() {
  return [
    'output-box',
    document.getElementById('font-face').value,
    document.getElementById('font-size').value,
    document.getElementById('line-height').value
  ].join(' ');
}

function render(text) {
  if (!text || !text.trim()) return;
  currentText = text;
  const ratio = getRatio();
  const html = bionicHTML(text, ratio);

  const output = document.getElementById('output');
  output.innerHTML = html;
  output.className = getOutputClasses();

  const words = text.trim().split(/\s+/).length;
  const chars = text.length;
  const mins  = Math.max(1, Math.round(words / 238));

  document.getElementById('stat-words').textContent = words.toLocaleString();
  document.getElementById('stat-chars').textContent = chars.toLocaleString();
  document.getElementById('stat-time').textContent  = mins + ' min';
  document.getElementById('output-section').style.display = 'flex';
}

// ── Sample grid ───────────────────────────────────────────────────────────────

const grid = document.getElementById('sample-grid');
SAMPLES.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'sample-card' + (i === 0 ? ' selected' : '');
  card.innerHTML = `<div class="sample-title">${s.title}</div><div class="sample-preview">${s.text.replace(/\n/g, ' ')}</div>`;
  card.addEventListener('click', () => {
    document.querySelectorAll('.sample-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedSample = i;
  });
  grid.appendChild(card);
});

// ── Events ────────────────────────────────────────────────────────────────────

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// Live conversion as you type
document.getElementById('input-text').addEventListener('input', e => {
  if (e.target.value.trim()) render(e.target.value);
  else document.getElementById('output-section').style.display = 'none';
});

document.getElementById('btn-convert').addEventListener('click', () => {
  render(document.getElementById('input-text').value);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('input-text').value = '';
  document.getElementById('output-section').style.display = 'none';
  currentText = '';
});

document.getElementById('btn-load-sample').addEventListener('click', () => {
  const text = SAMPLES[selectedSample].text;
  document.getElementById('input-text').value = text;
  document.querySelector('[data-tab="paste"]').click();
  render(text);
});

// Ratio slider — live update
document.getElementById('ratio').addEventListener('input', e => {
  document.getElementById('ratio-val').textContent = e.target.value + '%';
  if (currentText) render(currentText);
});

// Style selects — re-apply classes
['font-face','font-size','line-height'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (currentText) document.getElementById('output').className = getOutputClasses();
  });
});

// Copy HTML
document.getElementById('btn-copy-html').addEventListener('click', () => {
  const html = document.getElementById('output').innerHTML;
  navigator.clipboard.writeText(html).then(() => flashBtn('btn-copy-html', 'Copied!'));
});

// Copy plain text
document.getElementById('btn-copy-text').addEventListener('click', () => {
  navigator.clipboard.writeText(currentText).then(() => flashBtn('btn-copy-text', 'Copied!'));
});

// Print / Save PDF
document.getElementById('btn-print').addEventListener('click', () => window.print());

function flashBtn(id, msg) {
  const btn = document.getElementById(id);
  const orig = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => btn.textContent = orig, 1500);
}

// ── Print styles ──────────────────────────────────────────────────────────────

const printStyle = document.createElement('style');
printStyle.textContent = `
  @media print {
    .site-header, .controls-card, .tab-bar, .tab-panel, .output-toolbar, .stats, footer { display: none !important; }
    main { max-width: 100%; padding: 0; }
    .output-section { display: block !important; }
    .output-box { border: none; padding: 0; font-size: 14pt; line-height: 1.8; }
  }
`;
